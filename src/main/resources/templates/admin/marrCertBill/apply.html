<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('查档申请表（受理进单）')"/>
</head>
<body>
<form class="layui-form">
    <div class="mainBox">
        <div class="main-container">
            <div class="layui-form-item">
                <label class="layui-form-label">申请人</label>
                <div class="layui-input-block">
                    <input type="text" name="applicantName" lay-verify="required" autocomplete="off"
                           placeholder="申请人是谁（四样之一）" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">证件号码</label>
                <div class="layui-input-block">
                    <input type="text" name="applicantIdNo" lay-verify="required" autocomplete="off"
                           placeholder="一位申请人只配一条出证文本，据此拦截重复抄发" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">查档人身份</label>
                <div class="layui-input-inline" style="width: 220px;">
                    <select name="applicantType" lay-verify="required" id="applicantType">
                        <option value="">按身份分类，各拿各的凭证</option>
                        <option th:each="t : ${applicantTypes}" th:value="${t.key}"
                                th:text="${t.value}"></option>
                    </select>
                </div>
                <label class="layui-form-label" style="width: 90px;">凭证编号</label>
                <div class="layui-input-inline" style="width: 220px;">
                    <input type="text" name="credentialNo" lay-verify="required" autocomplete="off"
                           placeholder="该身份应持的查档凭证编号" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">来查哪一档</label>
                <div class="layui-input-block">
                    <input type="text" name="queryTarget" lay-verify="required" autocomplete="off"
                           placeholder="查档指向（四样之一）" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">卷宗字号</label>
                <div class="layui-input-block">
                    <input type="text" name="volumeNo" autocomplete="off"
                           placeholder="挂在哪个卷宗字号下（四样之一，只认在册编号，如 MH00）" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">出证事由</label>
                <div class="layui-input-block">
                    <select name="reasonCode" lay-verify="required">
                        <option value="">不在范围内的当场截住</option>
                        <option th:each="r : ${reasons}" th:value="${r.key}" th:text="${r.value}"></option>
                    </select>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">拟出文本</label>
                <div class="layui-input-block">
                    <textarea name="draftText" lay-verify="required" class="layui-textarea"
                              placeholder="准备写进证明的话怎么表述（四样之一）" style="height: 96px;"></textarea>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">备注</label>
                <div class="layui-input-block">
                    <textarea name="remark" class="layui-textarea" style="height: 60px;"></textarea>
                </div>
            </div>
        </div>
    </div>
    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="layui-btn layui-btn-normal layui-btn-sm" lay-submit lay-filter="cert-accept">
                <i class="layui-icon layui-icon-ok"></i> 受理进单
            </button>
            <button type="reset" class="layui-btn layui-btn-primary layui-btn-sm">
                <i class="layui-icon layui-icon-refresh"></i> 重置
            </button>
        </div>
    </div>
</form>
<th:block th:include="include :: footer"/>
<script>
    layui.use(['form', 'jquery'], function () {
        let form = layui.form;
        let $ = layui.jquery;
        let MODULE_PATH = rootPath + "/marrCertBill";

        form.on('submit(cert-accept)', function (data) {
            $.ajax({
                url: MODULE_PATH + '/accept',
                data: data.field,
                dataType: 'json',
                type: 'post',
                success: function (result) {
                    if (result.code == 200) {
                        layer.msg(result.msg, {icon: 1, time: 1500}, function () {
                            parent.layer.close(parent.layer.getFrameIndex(window.name));
                            parent.layui.table.reload("cert-table");
                        });
                    } else {
                        layer.msg(result.msg, {icon: 2, time: 2500});
                    }
                }
            });
            return false;
        });
    });
</script>
</body>
</html>
